    <div class="titulo-pagina largo">
        <h1>Frequência da turma</h1>
        <p>Defina o total de aulas e acompanhe a frequência de cada aluna</p>
    </div>
    <div class="subnav largo">
        <a href="chamada.html">Chamada</a>
        <a href="frequencia.html" class="ativo">Frequência</a>
        <a href="conclusao.html">Conclusão</a>
    </div>
    <div class="container-chamada largo">
        <div class="info-chamada">
            <div class="info-item">
                <label for="selecionarTurma">Turma:</label>
                <select id="selecionarTurma" class="campo-chamada">
                    <option value="" disabled selected>Selecione a turma</option>
                </select>
            </div>

            <div class="info-item">
                <label for="totalAulas">Total de aulas previstas no curso:</label>
                <div class="linha-total">
                    <input type="number" id="totalAulas" class="campo-chamada" min="1" max="500" placeholder="Ex.: 20" disabled>
                    <button type="button" class="botao-secundario" id="salvarTotal" disabled>Salvar</button>
                </div>
            </div>
        </div>

        <div class="calculo" id="calculo"></div>

        <p id="avisoLogins" class="aviso-chamada" role="status"></p>

        <div class="tabela-rolagem">
            <table class="tabela-frequencia">
                <thead>
                    <tr>
                        <th>Aluna</th>
                        <th class="num">Presenças</th>
                        <th class="num">Faltas</th>
                        <th>Frequência</th>
                        <th>Situação</th>
                        <th>Login da aluna</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela"></tbody>
            </table>
        </div>

        <p id="mensagemChamada" role="status"></p>
    </div>

    <script src="comum.js"></script>
    <script src="frequencia.js"></script>
